[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firewise"
version = "0.1.0"
description = "Educational firewall rule health checker"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "pandas>=2.1",
    "plotly>=5.18",
    "pyvis>=0.3",
    "streamlit>=1.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["ai*", "core*", "data*", "reports*"]

[tool.setuptools.package-data]
data = ["demo_rules.csv"]
