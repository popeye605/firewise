[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firewise"
version = "0.1.0"
description = "Educational firewall rule health checker"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "networkx>=3.2,<4",
    "pandas>=2.1,<3",
    "plotly>=5.18,<8",
    "pyvis>=0.3,<1",
    "streamlit>=1.30,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.urls]
Homepage = "https://github.com/popeye605/firewise"
Repository = "https://github.com/popeye605/firewise"
Documentation = "https://github.com/popeye605/firewise#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["ai*", "core*", "data*", "reports*"]

[tool.setuptools.package-data]
data = ["demo_rules.csv", "astar_demo.csv", "stress_rules.csv"]
